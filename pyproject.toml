[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsuite-sdk"
version = "0.12.0"
description = "Unified Google Workspace SDK - Gmail, Calendar, Drive, Sheets, Tasks, Contacts, Search Console, GA4, Tag Manager"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Pablo Alaniz", email = "alanizpablo@gmail.com"}
]
keywords = ["google", "workspace", "gmail", "calendar", "drive", "sheets", "tasks", "contacts", "search-console", "analytics", "tag-manager", "oauth", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "google-auth>=2.27.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.114.0",
    "google-auth-httplib2>=0.2.0",
    "httplib2>=0.19.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # zoneinfo needs it where the OS has no time zone database (Windows)
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "httpx>=0.27.0",
    "hypothesis>=6.100.0",
]
cloudrun = [
    "google-cloud-secret-manager>=2.18.0",
    "google-cloud-logging>=3.9.0",
]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "email-validator>=2.1.0",
]
cli = [
    "typer>=0.15.4",
    "rich>=13.7.0",
]
# Worksheet.to_dataframe / from_dataframe; not in "all" because pandas is heavy
pandas = [
    "pandas>=2.2.2",  # first release built for numpy 2
]
# Polars DataFrames for the Sheets engine (dataframe_backend="polars")
polars = [
    "polars>=0.20",
]
# Async clients (gsuite_core.aio, AsyncSheets)
async = [
    "httpx>=0.27.0",
]
all = [
    "gsuite-sdk[api,cli,cloudrun,async]",
]

[project.scripts]
gsuite = "gsuite_cli.main:main"

[project.urls]
Homepage = "https://github.com/PabloAlaniz/google-suite"
Repository = "https://github.com/PabloAlaniz/google-suite"
Documentation = "https://pabloalaniz.github.io/google-suite/"

[tool.ruff]
target-version = "py311"
line-length = 100
# README examples are hand-aligned; newer ruff formats Markdown code blocks
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "S", "RUF", "SIM", "PT", "RET", "PIE",
    "ARG", "BLE", "DTZ", "FLY", "FURB", "G", "ISC", "LOG", "N", "PERF", "PGH", "PLE", "PLW",
    "PTH", "T20", "TID",
    "A", "C90", "PLR0911", "PLR0912", "PLR0915", "PLR2004", "RSE", "TRY",
]
# Not enabled: TC (FastAPI, Typer and pydantic read annotations at runtime) and
# ERA (flags the "# ---- section" comments as commented-out code).
# TRY003 asks for an exception class per message; GSuiteError(message) is the
# SDK's style. EM is off for a related reason: ValidationError(field, message)
# takes the field first, and its autofix would bind the field to `msg`.
ignore = ["TRY003"]
# Pylint code used in existing noqa comments; keeps RUF100 from stripping them
external = ["PLC0415"]

[tool.ruff.lint.per-file-ignores]
# Tests use bare asserts and dummy credentials/paths
# Tests also mock call signatures (ARG), build naive datetimes on purpose (DTZ),
# mirror camelCase Google API methods (N802/N803), use plain os/open (PTH) and
# compare against literal expected values (PLR2004); fakes take `id` (A002)
# and tests raise inside try blocks on purpose (TRY301)
"**/tests/**" = ["S101", "S105", "S106", "S108", "ARG", "DTZ", "N802", "N803", "PTH", "PLW0108", "PLR2004", "A002", "TRY301"]
"conftest.py" = ["S101", "S105", "S106", "S108", "ARG", "DTZ", "N802", "N803", "PTH", "PLW0108", "PLR2004", "A002", "TRY301"]
# Fakes and property strategies shipped for tests: same reasons, and the REST
# fake dispatches every endpoint from one function
"**/testing/**" = ["ARG", "DTZ", "N802", "N803", "PLR2004", "C901", "PLR0911", "PLR0912"]
"**/_testing/**" = ["ARG", "BLE001", "DTZ", "N818", "PLR2004"]
# Command-line scripts report through stdout
"scripts/**" = ["T20"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-builtins]
# Public keyword arguments (worksheet.get(range=...), export(format=...),
# share(type=...), larger(bytes=...)); renaming them would break callers
builtins-ignorelist = ["bytes", "format", "range", "type"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI/Typer declare parameters through calls in defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "typer.Option", "typer.Argument"]

[tool.ruff.lint.isort]
known-first-party = ["gsuite_core", "gsuite_gmail", "gsuite_calendar", "gsuite_drive", "gsuite_sheets", "gsuite_tasks", "gsuite_contacts", "gsuite_searchconsole", "gsuite_analytics", "gsuite_tagmanager", "gsuite_mcp", "gsuite_api", "gsuite_cli"]

[tool.mypy]
python_version = "3.11"
strict = true
# google-auth and google-cloud-* ship partial annotations; calling their
# untyped functions (Credentials(...), refresh) is not a defect here
untyped_calls_exclude = ["google"]
# Editable installs use an import hook mypy can't follow; point it at the
# sources so cross-package imports type-check instead of erroring.
mypy_path = "packages/core/src:packages/gmail/src:packages/calendar/src:packages/drive/src:packages/sheets/src:packages/tasks/src:packages/contacts/src:packages/searchconsole/src:packages/analytics/src:packages/tagmanager/src:packages/mcp/src:api/src:cli/src"

[[tool.mypy.overrides]]
# Google's client libraries ship without type information
module = ["googleapiclient.*", "google_auth_oauthlib.*", "google.cloud.*", "google_auth_httplib2", "httplib2", "pandas"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/*/tests", "api/tests", "cli/tests"]
addopts = "-v --tb=short --import-mode=importlib"

[tool.setuptools.packages.find]
where = ["packages/core/src", "packages/gmail/src", "packages/calendar/src", "packages/drive/src", "packages/sheets/src", "packages/tasks/src", "packages/contacts/src", "packages/searchconsole/src", "packages/analytics/src", "packages/tagmanager/src", "api/src", "cli/src"]
include = ["gsuite_*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.coverage.run]
source = ["gsuite_core", "gsuite_gmail", "gsuite_calendar", "gsuite_drive", "gsuite_sheets", "gsuite_tasks", "gsuite_contacts", "gsuite_searchconsole", "gsuite_analytics", "gsuite_tagmanager", "gsuite_mcp", "gsuite_api", "gsuite_cli"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
# cli/tests/test_skill_md.py; a group, not an extra: PyPI rejects git dependencies in metadata
skill = ["agent-skill-check"]
# The MCP server is its own distribution (packages/mcp, published as gsuite-mcp)
mcp = ["gsuite-mcp"]
docs = [
    # MkDocs 2.0 drops the plugin system (mkdocstrings, the hooks); stay on 1.x
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.uv.workspace]
members = ["packages/mcp"]

[tool.uv.sources]
agent-skill-check = { path = "tools/agent-distribution", editable = true }
gsuite-mcp = { workspace = true }
