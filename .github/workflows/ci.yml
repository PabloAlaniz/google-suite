name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly: full matrix plus a run against the newest releases of every dependency
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.10.x"

jobs:
  changes:
    name: Select packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packages: ${{ steps.select.outputs.packages }}
      all: ${{ steps.select.outputs.all }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared:
              - pyproject.toml
              - uv.lock
              - conftest.py
              - scripts/**
              - tests/**
              - .github/workflows/ci.yml
              - packages/core/**
            gmail: packages/gmail/**
            calendar: packages/calendar/**
            drive: packages/drive/**
            sheets: packages/sheets/**
            tasks: packages/tasks/**
            contacts: packages/contacts/**
            api: api/**
            cli:
              - cli/**
              - skills/**   # the skill is checked by cli/tests/test_skill_md.py

      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: python3 scripts/ci_select_packages.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # ruff comes from uv.lock, so a new release can't break main on its own
      - run: uv sync --locked --extra dev
      - run: uv run ruff check packages/ api/ cli/ scripts/ tests/ conftest.py
      - run: uv run ruff format --check packages/ api/ cli/ scripts/ tests/ conftest.py
      # The integration tests only run on demand (integration.yml); collecting
      # them here keeps their imports and fixtures from rotting in between.
      - name: Collect integration tests
        run: uv run --all-extras pytest tests/integration --collect-only -q

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      # Error counts may only go down; see scripts/mypy_ratchet.py
      - run: uv run python scripts/mypy_ratchet.py

  test:
    name: test (${{ matrix.package }}, py${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-extras --group skill

      - name: Run tests
        env:
          COVERAGE_FILE: .coverage.${{ matrix.package }}
        run: |
          case "${{ matrix.package }}" in
            api|cli) path="${{ matrix.package }}/tests" ;;
            *) path="packages/${{ matrix.package }}/tests" ;;
          esac
          uv run pytest "$path" --cov --cov-report=

      # The Sheets engine tests again, through gsuite_sheets.engine_adapter
      # (real adapter over a fake googleapiclient service): a behavioral
      # contract test of the adapter.
      - name: Run engine tests through the adapter
        if: matrix.package == 'sheets'
        env:
          COVERAGE_FILE: .coverage.${{ matrix.package }}
        run: uv run pytest packages/sheets/tests --engine-backend=adapter --cov --cov-append --cov-report=

      - name: Upload coverage data
        if: matrix.python == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.package }}
          path: .coverage.${{ matrix.package }}
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    needs: [changes, test]
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          # Same Python as the data (uploaded from the 3.14 jobs): since 3.14,
          # bare annotations like `id: int` run no code (PEP 649), so a report
          # on another version counts them as statements that were never hit.
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --extra dev

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine and report
        run: |
          uv run coverage combine
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report

      # Only meaningful when every package ran; a PR touching one package
      # measures a slice of the code base.
      - name: Enforce coverage floor
        if: needs.changes.outputs.all == 'true'
        run: uv run coverage report --fail-under=85 > /dev/null

  test-os:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --all-extras --group skill
      - run: uv run pytest

  test-python-next:
    name: test (py3.15, experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --locked --all-extras --group skill
      - run: uv run pytest

  lowest-deps:
    name: test (lowest declared deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
      # Checks that the >= floors in pyproject.toml actually work
      - run: uv venv
      - run: uv pip install --resolution lowest-direct -e ".[all,dev,pandas,polars]"
      - run: uv run --no-sync pytest

  latest-deps:
    name: test (latest deps)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      # Catches upstream breakage (new FastAPI, google-api-python-client, ...)
      # before it lands in uv.lock
      - run: uv lock --upgrade
      - run: uv sync --all-extras --group skill
      - run: uv run pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check --strict dist/*

      - name: Install wheel in a clean venv
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke "$(ls dist/*.whl)[all]"

      - name: Import every module and run the CLI
        working-directory: /tmp
        run: |
          /tmp/smoke/bin/python -c "
          import gsuite_core, gsuite_gmail, gsuite_calendar, gsuite_drive, gsuite_sheets, gsuite_tasks, gsuite_contacts
          import gsuite_api.main, gsuite_cli.main
          "
          /tmp/smoke/bin/gsuite --help

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build API image
        run: |
          docker build -f api/Dockerfile -t gsuite-api:ci .
          echo "Image size: $(docker image inspect gsuite-api:ci --format '{{.Size}}' | numfmt --to=iec)" >> "$GITHUB_STEP_SUMMARY"
      # The image prunes googleapiclient's discovery documents down to
      # DISCOVERY_KEEP (api/tests/test_dockerfile.py checks that list against
      # the code); build each kept service offline inside the image.
      - name: Check discovery documents
        run: |
          keep=$(sed -n 's/^ARG DISCOVERY_KEEP="\(.*\)"/\1/p' api/Dockerfile)
          test -n "$keep"
          docker run --rm -e KEEP="$keep" --entrypoint python gsuite-api:ci -c '
          import os
          from googleapiclient.discovery import build
          for doc in os.environ["KEEP"].split():
              name, version = doc.split(".", 1)
              build(name, version, developerKey="ci", cache_discovery=False)
              print("ok", doc)
          '
      - name: Start container and check /health
        run: |
          docker run -d --name api -p 8080:8080 gsuite-api:ci
          for _ in $(seq 1 30); do
            curl -fsS localhost:8080/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1

  # The agent skill and the plugin/extension manifests (Agent Skills spec,
  # claude plugin validate); the content is checked by cli/tests/test_skill_md.py
  skills:
    uses: PabloAlaniz/agent-distribution/.github/workflows/skill-validate.yml@v1

  # Single stable check name for branch protection; matrix jobs that were
  # skipped by path filtering count as passing.
  ci-ok:
    if: always()
    needs: [changes, lint, typecheck, test, coverage, test-os, lowest-deps, latest-deps, build, docker, skills]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) exit 1 ;; esac
          done
