name: Publish to the MCP Registry

# Reusable: publishes server.json to the official MCP Registry
# (registry.modelcontextprotocol.io) with GitHub OIDC, so no secret is needed.
# Run it after the package (PyPI/npm) is published: the registry checks that
# the package exists and declares the server name (`mcp-name` in its README).
# The caller must grant `id-token: write`.
#
#   jobs:
#     mcp-registry:
#       needs: publish-pypi
#       permissions:
#         contents: read
#         id-token: write
#       uses: PabloAlaniz/google-suite/.github/workflows/reusable-mcp-registry-publish.yml@<commit-sha>
#       with:
#         ref: v1.2.0

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref with the server.json to publish (default: the triggering ref)"
        type: string
        default: ""
      server-json:
        type: string
        default: server.json

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: "1.8.1"
      # sha256 of mcp-publisher_linux_amd64.tar.gz, from registry_1.8.1_checksums.txt
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Publish
        env:
          SERVER_JSON: ${{ inputs.server-json }}
        run: |
          ./mcp-publisher login github-oidc
          if [ "$SERVER_JSON" != server.json ]; then cp "$SERVER_JSON" server.json; fi
          ./mcp-publisher publish
