[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsuite-sdk"
version = "0.4.0"
description = "Unified Google Workspace SDK - Gmail, Calendar, Drive, Sheets, Tasks, Contacts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Pablo Alaniz", email = "alanizpablo@gmail.com"}
]
keywords = ["google", "workspace", "gmail", "calendar", "drive", "sheets", "tasks", "contacts", "oauth", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "google-auth>=2.27.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.114.0",
    "google-auth-httplib2>=0.2.0",
    "httplib2>=0.19.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # zoneinfo needs it where the OS has no time zone database (Windows)
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "httpx>=0.27.0",
]
cloudrun = [
    "google-cloud-secret-manager>=2.18.0",
    "google-cloud-logging>=3.9.0",
]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "email-validator>=2.1.0",
]
cli = [
    "typer>=0.15.4",
    "rich>=13.7.0",
]
# Worksheet.to_dataframe / from_dataframe; not in "all" because pandas is heavy
pandas = [
    "pandas>=2.2.2",  # first release built for numpy 2
]
# Polars DataFrames for the Sheets engine (dataframe_backend="polars")
polars = [
    "polars>=0.20",
]
# Async clients (gsuite_core.aio, AsyncSheets)
async = [
    "httpx>=0.27.0",
]
all = [
    "gsuite-sdk[api,cli,cloudrun,async]",
]

[project.scripts]
gsuite = "gsuite_cli.main:main"

[project.urls]
Homepage = "https://github.com/PabloAlaniz/google-suite"
Repository = "https://github.com/PabloAlaniz/google-suite"
Documentation = "https://pabloalaniz.github.io/google-suite/"

[tool.ruff]
target-version = "py311"
line-length = 100
# README examples are hand-aligned; newer ruff formats Markdown code blocks
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = [
    "E501",   # Line too long
    "B008",   # Function call in default argument
    "B904",   # raise ... from err (too noisy for now)
    "E741",   # Ambiguous variable name (l, I, O)
    "F401",   # Imported but unused (conditional imports)
    "F841",   # Local variable assigned but never used
    "W293",   # Blank line contains whitespace
    "E402",   # Module level import not at top
    "B905",   # zip without strict
]

[tool.ruff.lint.isort]
known-first-party = ["gsuite_core", "gsuite_gmail", "gsuite_calendar", "gsuite_drive", "gsuite_sheets", "gsuite_tasks", "gsuite_contacts", "gsuite_mcp", "gsuite_api", "gsuite_cli"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
# Editable installs use an import hook mypy can't follow; point it at the
# sources so cross-package imports type-check instead of erroring.
mypy_path = "packages/core/src:packages/gmail/src:packages/calendar/src:packages/drive/src:packages/sheets/src:packages/tasks/src:packages/contacts/src:packages/mcp/src:api/src:cli/src"

[[tool.mypy.overrides]]
# Google's client libraries ship without type information
module = ["googleapiclient.*", "google_auth_oauthlib.*", "google.cloud.*", "google_auth_httplib2", "httplib2", "pandas"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/*/tests", "api/tests", "cli/tests"]
addopts = "-v --tb=short --import-mode=importlib"

[tool.setuptools.packages.find]
where = ["packages/core/src", "packages/gmail/src", "packages/calendar/src", "packages/drive/src", "packages/sheets/src", "packages/tasks/src", "packages/contacts/src", "api/src", "cli/src"]
include = ["gsuite_*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.coverage.run]
source = ["gsuite_core", "gsuite_gmail", "gsuite_calendar", "gsuite_drive", "gsuite_sheets", "gsuite_tasks", "gsuite_contacts", "gsuite_mcp", "gsuite_api", "gsuite_cli"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
# cli/tests/test_skill_md.py; a group, not an extra: PyPI rejects git dependencies in metadata
skill = ["agent-skill-check"]
# The MCP server is its own distribution (packages/mcp, published as gsuite-mcp)
mcp = ["gsuite-mcp"]
docs = [
    # MkDocs 2.0 drops the plugin system (mkdocstrings, the hooks); stay on 1.x
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.uv.workspace]
members = ["packages/mcp"]

[tool.uv.sources]
agent-skill-check = { path = "tools/agent-distribution", editable = true }
gsuite-mcp = { workspace = true }
