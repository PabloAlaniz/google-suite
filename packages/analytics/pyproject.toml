[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsuite-analytics"
version = "0.1.0"
description = "Google Suite Analytics (GA4) - read-only client"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Pablo Alaniz", email = "alanizpablo@gmail.com"}
]
dependencies = [
    "gsuite-core>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/PabloAlaniz/google-suite"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gsuite_analytics*"]

[tool.setuptools.package-data]
gsuite_analytics = ["py.typed"]
