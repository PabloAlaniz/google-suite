name: Release

# Keep this file name: PyPI trusted publishing is bound to it.
#
# On every push to main, release-please opens or updates a release PR that
# bumps pyproject.toml, uv.lock and CHANGELOG.md from conventional commits.
# Merging that PR creates the tag and GitHub release, and the jobs below
# build and publish to PyPI, then publish the agent skill (skills/gsuite-sdk)
# to ClawHub with the same version. workflow_dispatch republishes the current
# version (both steps are idempotent).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # PRs opened with the default GITHUB_TOKEN don't trigger CI, so the
          # required ci-ok check would never report on the release PR. A
          # fine-grained PAT (contents + pull requests: write) fixes that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build --all-packages   # gsuite-sdk and gsuite-mcp
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing + attestations
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  version:
    needs: [release-please, publish]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false
      - id: read
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The agent skill (skills/gsuite-sdk) goes to ClawHub
  # (clawhub.ai/pabloalaniz/gsuite-sdk) with the same version as the SDK.
  # Needs CLAWHUB_TOKEN in the "clawhub" environment; without it the job
  # leaves a notice and the release still succeeds.
  skill:
    needs: version
    uses: ./.github/workflows/reusable-clawhub-publish.yml
    with:
      skill-path: skills/gsuite-sdk
      slug: gsuite-sdk
      version: ${{ needs.version.outputs.version }}
      ref: v${{ needs.version.outputs.version }}
    # CLAWHUB_TOKEN is an environment secret of "clawhub", read inside the called job
    secrets: inherit

  # The MCP server (gsuite-mcp on PyPI) in the official MCP Registry, with
  # GitHub OIDC (no secret). Runs after PyPI: the registry checks that the
  # package exists and declares the server name (mcp-name in its README).
  mcp-registry:
    needs: version
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-mcp-registry-publish.yml
    with:
      ref: v${{ needs.version.outputs.version }}
