name: Docs

# Builds the MkDocs site in strict mode on every PR that can affect it (broken
# links and bad docstrings fail the build) and deploys it to GitHub Pages from
# main. Pages must be enabled with "GitHub Actions" as the source.

on:
  pull_request:
    paths: &docs-paths
      - docs/**
      - mkdocs.yml
      - scripts/mkdocs_hooks.py
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - SECURITY.md
      - packages/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths: *docs-paths
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.10.x"
  NO_MKDOCS_2_WARNING: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --group docs
      - run: uv run mkdocs build --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
