version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for routine bumps; security updates still come individually
      python-deps:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  # Hash-pinned runtime deps for the fuzz build (.clusterfuzzlite/build.sh)
  - package-ecosystem: pip
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
    groups:
      fuzz-deps:
        patterns: ["*"]
    commit-message:
      prefix: build
