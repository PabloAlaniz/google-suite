[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-skill-check"
version = "0.1.0"
description = "Keep an agent skill (SKILL.md) in sync with the Python library and CLI it documents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Pablo Alaniz", email = "alanizpablo@gmail.com" }]
keywords = ["agent-skills", "skill", "claude", "openclaw", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = ["skills-ref>=0.1.1", "strictyaml>=1.7.3"]

[project.urls]
Homepage = "https://github.com/PabloAlaniz/google-suite/tree/main/tools/agent-distribution"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "click>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_skill_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/fixtures"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
