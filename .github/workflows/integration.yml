name: Integration

# End-to-end tests against a real (throwaway) Google account; see
# tests/integration/conftest.py. Needs the GSUITE_INTEGRATION_TOKEN secret in
# the "integration" environment: the output of `gsuite auth export` after
# `gsuite auth login --scopes all` with that account. Without it the job
# reports a notice and passes.
#
# OAuth apps in "Testing" publishing status get refresh tokens that expire
# after 7 days; publish the consent screen (or re-export weekly) to keep this
# running.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # Mondays

concurrency:
  group: integration
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_VERSION: "0.10.x"

jobs:
  integration:
    runs-on: ubuntu-latest
    environment: integration
    steps:
      - name: Check credentials
        id: token
        env:
          TOKEN: ${{ secrets.GSUITE_INTEGRATION_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::GSUITE_INTEGRATION_TOKEN is not set; skipping integration tests"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.token.outputs.present == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - if: steps.token.outputs.present == 'true'
        run: uv sync --locked --all-extras
      - if: steps.token.outputs.present == 'true'
        env:
          GSUITE_INTEGRATION: "1"
          GSUITE_INTEGRATION_TOKEN: ${{ secrets.GSUITE_INTEGRATION_TOKEN }}
        run: uv run pytest tests/integration -rs
