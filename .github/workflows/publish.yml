name: Release

# Keep this file name: PyPI trusted publishing is bound to it.
#
# On every push to main, release-please opens or updates a release PR that
# bumps pyproject.toml, uv.lock and CHANGELOG.md from conventional commits.
# Merging that PR creates the tag and GitHub release, and the jobs below
# build and publish to PyPI, then publish the agent skill (skills/gsuite-sdk)
# to ClawHub with the same version. workflow_dispatch republishes the current
# version (both steps are idempotent).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # PRs opened with the default GITHUB_TOKEN don't trigger CI, so the
          # required ci-ok check would never report on the release PR. A
          # fine-grained PAT (contents + pull requests: write) fixes that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps whole JSON values, but the Claude plugin pins
      # "gsuite-mcp==X.Y.Z" inside a string; sync it on the release PR branch
      # (rerun after every update, since release-please rewrites the branch).
      # On the run that cuts the release, `pr` is set but isn't PR JSON.
      - name: Pin gsuite-mcp in the Claude plugin on the release PR
        if: steps.release.outputs.release_created != 'true'
        env:
          PR: ${{ steps.release.outputs.pr }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          BRANCH=$(jq -r '.headBranchName // empty' <<<"$PR" 2>/dev/null || true)
          if [ -z "$BRANCH" ]; then
            echo "no release PR open"
            exit 0
          fi
          git clone --quiet --depth 1 --branch "$BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/release-pr"
          cd "$RUNNER_TEMP/release-pr"
          python3 scripts/sync_claude_plugin.py
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --quiet -am "chore: pin gsuite-mcp in the Claude plugin"
            git push --quiet origin "HEAD:$BRANCH"
          fi

  build:
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build --all-packages   # gsuite-sdk and gsuite-mcp
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing + attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  version:
    needs: [release-please, publish]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false
      - id: read
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The agent skill (skills/gsuite-sdk) goes to ClawHub
  # (clawhub.ai/pabloalaniz/gsuite-sdk) with the same version as the SDK.
  # Needs CLAWHUB_TOKEN in the "clawhub" environment; without it the job
  # leaves a notice and the release still succeeds.
  skill:
    needs: version
    # release-please is skipped on workflow_dispatch; don't inherit that skip
    if: always() && needs.version.result == 'success'
    uses: ./.github/workflows/reusable-clawhub-publish.yml
    with:
      skill-path: skills/gsuite-sdk
      slug: gsuite-sdk
      version: ${{ needs.version.outputs.version }}
      ref: v${{ needs.version.outputs.version }}
    # CLAWHUB_TOKEN is an environment secret of "clawhub", read inside the called job
    secrets: inherit

  # The MCP server (gsuite-mcp on PyPI) in the official MCP Registry, with
  # GitHub OIDC (no secret). Runs after PyPI: the registry checks that the
  # package exists and declares the server name (mcp-name in its README).
  mcp-registry:
    needs: version
    # release-please is skipped on workflow_dispatch; don't inherit that skip
    if: always() && needs.version.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-mcp-registry-publish.yml
    with:
      ref: v${{ needs.version.outputs.version }}

  # The Claude Directory follows the `claude-plugin` branch, which holds only
  # plugins/gsuite-sdk (see scripts/claude_plugin_branch.sh). Runs after PyPI
  # so the plugin's gsuite-mcp==X.Y.Z pin already resolves.
  claude-plugin:
    needs: version
    # release-please is skipped on workflow_dispatch; don't inherit that skip
    if: always() && needs.version.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.version.outputs.version }}
          persist-credentials: false
      - name: Update the claude-plugin branch
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          branch="$RUNNER_TEMP/claude-plugin"
          git clone --quiet --single-branch --branch claude-plugin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          scripts/claude_plugin_branch.sh "$branch"
          cd "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo "claude-plugin is already at $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "gsuite-sdk plugin $VERSION (from ${GITHUB_SHA::7})"
          git push --quiet origin HEAD:claude-plugin
