[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsuite-mcp"
version = "0.3.0"
description = "MCP server for Google Workspace (Gmail, Calendar, Drive, Sheets, Tasks, Contacts), built on gsuite-sdk"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Pablo Alaniz", email = "alanizpablo@gmail.com"}
]
keywords = ["mcp", "model-context-protocol", "google-workspace", "gmail", "google-sheets", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business",
]
dependencies = [
    "gsuite-sdk>=0.3.0",
    "mcp>=2.3,<3",
]

[project.scripts]
gsuite-mcp = "gsuite_mcp.server:main"

[project.urls]
Homepage = "https://pabloalaniz.github.io/google-suite/"
Repository = "https://github.com/PabloAlaniz/google-suite"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gsuite_mcp*"]

[tool.setuptools.package-data]
gsuite_mcp = ["py.typed"]

[tool.uv.sources]
gsuite-sdk = { workspace = true }
