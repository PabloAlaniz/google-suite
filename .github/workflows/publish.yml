name: Release

# Keep this file name: PyPI trusted publishing is bound to it.
#
# On every push to main, release-please opens or updates a release PR that
# bumps pyproject.toml, uv.lock and CHANGELOG.md from conventional commits.
# Merging that PR creates the tag and GitHub release, and the jobs below
# build and publish to PyPI, then publish the OpenClaw skill (gsuite-sdk/)
# to ClawHub with the same version. workflow_dispatch republishes the current
# version (both steps are idempotent).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # PRs opened with the default GITHUB_TOKEN don't trigger CI, so the
          # required ci-ok check would never report on the release PR. A
          # fine-grained PAT (contents + pull requests: write) fixes that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing + attestations
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  # The OpenClaw skill in gsuite-sdk/ is published to ClawHub
  # (clawhub.ai/pabloalaniz/gsuite-sdk) with the same version as the SDK.
  # Needs the CLAWHUB_TOKEN secret in the "clawhub" environment; without it
  # the job leaves a notice and the release still succeeds.
  skill:
    needs: [release-please, publish]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    environment: clawhub
    env:
      CLAWHUB_VERSION: "0.23.3"
      CLAWHUB_DISABLE_TELEMETRY: "1"
      npm_config_update_notifier: "false"
    steps:
      - name: Check credentials
        id: token
        env:
          TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLAWHUB_TOKEN is not set; the skill was not published to ClawHub"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false
      - name: Publish the skill
        if: steps.token.outputs.present == 'true'
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          export CLAWHUB_CONFIG_PATH="$RUNNER_TEMP/clawhub.json"   # token stays in the runner's temp dir
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          npx -y "clawhub@$CLAWHUB_VERSION" --no-input login --token "$CLAWHUB_TOKEN"
          npx -y "clawhub@$CLAWHUB_VERSION" --no-input skill publish gsuite-sdk \
            --slug gsuite-sdk \
            --version "$version" \
            --changelog "gsuite-sdk $version: https://github.com/$GITHUB_REPOSITORY/releases/tag/v$version" \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$(git rev-parse HEAD)" \
            --source-ref "v$version" \
            --source-path gsuite-sdk
